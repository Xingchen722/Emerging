<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenAI + Power BI 集成测试</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .content {
            padding: 30px;
        }
        
        .test-section {
            margin-bottom: 30px;
            padding: 20px;
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            background: #fafafa;
        }
        
        .test-section h3 {
            margin-top: 0;
            color: #333;
        }
        
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }
        
        .btn:hover {
            opacity: 0.9;
        }
        
        .result {
            margin-top: 15px;
            padding: 15px;
            background: white;
            border-radius: 5px;
            border-left: 4px solid #667eea;
        }
        
        .status {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }
        
        .status.success {
            background: #d4edda;
            color: #155724;
        }
        
        .status.error {
            background: #f8d7da;
            color: #721c24;
        }
        
        .status.warning {
            background: #fff3cd;
            color: #856404;
        }
        
        .input-group {
            margin-bottom: 15px;
        }
        
        .input-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
        }
        
        .input-group input, .input-group textarea {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔗 OpenAI + Power BI 集成测试</h1>
            <p>测试系统集成状态和功能</p>
        </div>
        
        <div class="content">
            <!-- 系统状态检查 -->
            <div class="test-section">
                <h3>📊 系统状态检查</h3>
                <button class="btn" onclick="checkSystemStatus()">检查系统状态</button>
                <div id="systemStatus" class="result" style="display: none;"></div>
            </div>
            
            <!-- OpenAI测试 -->
            <div class="test-section">
                <h3>🤖 OpenAI API测试</h3>
                <div class="input-group">
                    <label>测试问题：</label>
                    <input type="text" id="openaiQuestion" value="新加坡港的泊位时间是多少？" placeholder="输入测试问题">
                </div>
                <button class="btn" onclick="testOpenAI()">测试OpenAI回复</button>
                <button class="btn" onclick="testOpenAIKeywords()">测试关键词提取</button>
                <div id="openaiResult" class="result" style="display: none;"></div>
            </div>
            
            <!-- Power BI测试 -->
            <div class="test-section">
                <h3>📈 Power BI测试</h3>
                <div class="input-group">
                    <label>Power BI查询：</label>
                    <input type="text" id="powerbiQuery" value="EVALUATE BerthTimeData" placeholder="输入Power BI查询">
                </div>
                <button class="btn" onclick="testPowerBI()">测试Power BI查询</button>
                <button class="btn" onclick="checkPowerBIStatus()">检查Power BI状态</button>
                <div id="powerbiResult" class="result" style="display: none;"></div>
            </div>
            
            <!-- 完整流程测试 -->
            <div class="test-section">
                <h3>🔄 完整流程测试</h3>
                <div class="input-group">
                    <label>用户问题：</label>
                    <textarea id="fullTestQuestion" rows="3" placeholder="输入完整测试问题">查询鹿特丹港的碳减排数据</textarea>
                </div>
                <button class="btn" onclick="testFullFlow()">测试完整流程</button>
                <div id="fullFlowResult" class="result" style="display: none;"></div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE_URL = 'http://localhost:8080/api';
        
        // 检查系统状态
        async function checkSystemStatus() {
            const resultDiv = document.getElementById('systemStatus');
            resultDiv.style.display = 'block';
            resultDiv.innerHTML = '<div>正在检查系统状态...</div>';
            
            try {
                const response = await fetch(`${API_BASE_URL}/chat/system/status`);
                const status = await response.json();
                
                let html = '<h4>系统状态：</h4>';
                Object.entries(status).forEach(([service, available]) => {
                    const statusClass = available ? 'success' : 'error';
                    const statusText = available ? '可用' : '不可用';
                    html += `<div><span class="status ${statusClass}">${statusText}</span> ${service}</div>`;
                });
                
                resultDiv.innerHTML = html;
            } catch (error) {
                resultDiv.innerHTML = `<div class="status error">检查失败: ${error.message}</div>`;
            }
        }
        
        // 测试OpenAI
        async function testOpenAI() {
            const question = document.getElementById('openaiQuestion').value;
            const resultDiv = document.getElementById('openaiResult');
            resultDiv.style.display = 'block';
            resultDiv.innerHTML = '<div>正在测试OpenAI...</div>';
            
            try {
                const response = await fetch(`${API_BASE_URL}/chat/openai/generate-response?question=${encodeURIComponent(question)}&language=zh`);
                const result = await response.text();
                
                resultDiv.innerHTML = `<h4>OpenAI回复：</h4><div>${result}</div>`;
            } catch (error) {
                resultDiv.innerHTML = `<div class="status error">测试失败: ${error.message}</div>`;
            }
        }
        
        // 测试OpenAI关键词提取
        async function testOpenAIKeywords() {
            const question = document.getElementById('openaiQuestion').value;
            const resultDiv = document.getElementById('openaiResult');
            resultDiv.style.display = 'block';
            resultDiv.innerHTML = '<div>正在测试关键词提取...</div>';
            
            try {
                const response = await fetch(`${API_BASE_URL}/chat/openai/extract-keywords?question=${encodeURIComponent(question)}&language=zh`);
                const result = await response.text();
                
                resultDiv.innerHTML = `<h4>提取的关键词：</h4><div><pre>${result}</pre></div>`;
            } catch (error) {
                resultDiv.innerHTML = `<div class="status error">测试失败: ${error.message}</div>`;
            }
        }
        
        // 测试Power BI
        async function testPowerBI() {
            const query = document.getElementById('powerbiQuery').value;
            const resultDiv = document.getElementById('powerbiResult');
            resultDiv.style.display = 'block';
            resultDiv.innerHTML = '<div>正在测试Power BI查询...</div>';
            
            try {
                const response = await fetch(`${API_BASE_URL}/chat/powerbi/query?query=${encodeURIComponent(query)}`, {
                    method: 'POST'
                });
                const result = await response.json();
                
                let html = '<h4>Power BI查询结果：</h4>';
                if (result.length > 0) {
                    result.forEach((item, index) => {
                        html += `<div><strong>记录 ${index + 1}:</strong><br>`;
                        html += `港口: ${item.portName}<br>`;
                        html += `类型: ${item.dataType}<br>`;
                        html += `描述: ${item.description}<br>`;
                        html += `更新时间: ${item.timestamp}<br></div><br>`;
                    });
                } else {
                    html += '<div class="status warning">无数据返回</div>';
                }
                
                resultDiv.innerHTML = html;
            } catch (error) {
                resultDiv.innerHTML = `<div class="status error">测试失败: ${error.message}</div>`;
            }
        }
        
        // 检查Power BI状态
        async function checkPowerBIStatus() {
            const resultDiv = document.getElementById('powerbiResult');
            resultDiv.style.display = 'block';
            resultDiv.innerHTML = '<div>正在检查Power BI状态...</div>';
            
            try {
                const response = await fetch(`${API_BASE_URL}/chat/powerbi/status`);
                const status = await response.json();
                
                let html = '<h4>Power BI状态：</h4>';
                html += `<div><span class="status ${status.available ? 'success' : 'error'}">${status.available ? '可用' : '不可用'}</span></div>`;
                if (status.dashboardUrl) {
                    html += `<div>仪表板URL: <a href="${status.dashboardUrl}" target="_blank">${status.dashboardUrl}</a></div>`;
                }
                
                resultDiv.innerHTML = html;
            } catch (error) {
                resultDiv.innerHTML = `<div class="status error">检查失败: ${error.message}</div>`;
            }
        }
        
        // 测试完整流程
        async function testFullFlow() {
            const question = document.getElementById('fullTestQuestion').value;
            const resultDiv = document.getElementById('fullFlowResult');
            resultDiv.style.display = 'block';
            resultDiv.innerHTML = '<div>正在测试完整流程...</div>';
            
            try {
                const response = await fetch(`${API_BASE_URL}/chat/message?language=zh`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        content: question,
                        sender: 'user',
                        language: 'zh'
                    })
                });
                
                const result = await response.json();
                
                let html = '<h4>完整流程测试结果：</h4>';
                html += `<div><strong>用户问题:</strong> ${question}</div><br>`;
                html += `<div><strong>AI回复:</strong><br>${result.content}</div>`;
                
                resultDiv.innerHTML = html;
            } catch (error) {
                resultDiv.innerHTML = `<div class="status error">测试失败: ${error.message}</div>`;
            }
        }
        
        // 页面加载时自动检查系统状态
        window.onload = function() {
            checkSystemStatus();
        };
    </script>
</body>
</html>
